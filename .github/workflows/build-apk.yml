name: Build ReplyFloatAI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          rm -rf android-build
          mkdir android-build
          unzip -q ReplyFloatAI_GitHub_ready.zip -d android-build

          echo "Extracted files:"
          find android-build -maxdepth 2 -type f | sort | head -100

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        working-directory: android-build
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          test -f android-build/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android-build/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ReplyFloatAI-debug-apk
          path: android-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
