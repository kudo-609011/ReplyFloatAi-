name: Build Debug APK

on:
  push:
    branches:
      - ai
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK exists under app/build/outputs/apk/debug/
        run: |
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ] && [ -z "$(ls -A app/build/outputs/apk/debug/*.apk 2>/dev/null)" ]; then
            echo "Error: Debug APK not found in app/build/outputs/apk/debug/"
            exit 1
          fi
          echo "Verified debug APK exists:"
          ls -lh app/build/outputs/apk/debug/*.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReplyFloatAI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
