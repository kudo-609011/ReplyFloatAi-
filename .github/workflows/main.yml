```yaml
name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - ai

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check project
        run: |
          echo "Repository:"
          pwd
          echo "Files:"
          ls -la
          echo "Gradle files:"
          find . -maxdepth 3 \( -name "gradlew" -o -name "gradle-wrapper.properties" -o -name "libs.versions.toml" \) -print

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: Debug APK was not created."
            echo "APK files found:"
            find app/build/outputs/apk -type f -name "*.apk" -print 2>/dev/null || true
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ReplyFloatAI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
```

